

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c2c2c; 
        }

        .container {
            background-color: rgb(83, 72, 72);
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: white;
            margin-bottom: 15px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #d00000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #a00000;
        }

        .login-link {
            margin-top: 10px;
            color: white;
            font-size: 14px;
        }

        .login-link a {
            color: lightblue;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }





    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form id="RegisterForm" >
            <div class="input-box">
                <input type="text" name="username" id="username" placeholder="Full Name" required>
            </div>
            <div class="input-box">
                <input type="email"  name="email" placeholder="Email" required>
            </div>
            <div class="input-box">
                <input type="password" name="password" id="password" placeholder="Password" required>
            </div>
            <div class="input-box">
                <input type="password" name="confirm_password"  id="confirm_password" placeholder="Confirm Password" required>
            </div>
            
            <button type="submit" class="btn" onclick="window.location.href='registered.html'">Register</button>
           
        </form>
        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
        
    </div>
    <script>
        document.getElementById("RegisterForm").addEventListener("submit", async function(event) {
            event.preventDefault(); // Prevent default form submission
        
            // Collect form data
            const formData = {
                username: document.getElementById("username").value,
                email: document.querySelector("input[name='email']").value,
                password: document.getElementById("password").value
            };
        
            try {
                // Send data to backend
                const response = await fetch("http://localhost:5001/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });
        
                const data = await response.json();
        
                if (response.ok) {
                    alert(data.message); // Show success message
                    window.location.href = "registered.html"; // Redirect to registered.html
                } else {
                    alert("Error: " + data.error); // Show error message
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Failed to register. Please try again.");
            }
        });
        </script>
        

</body>
</html>
