

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Exercises</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #001f3f, #003366);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: auto;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 15px rgba(255, 255, 255, 0.2);
            height: 100vh;
            position: fixed;
        }

        .sidebar-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #00e5ff;
        }

        .exercise-group {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            margin: 10px 0;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            color: #00e5ff;
            font-size: 20px;
            text-decoration: none;
        }

        .exercise-group:hover {
            background: #00e5ff;
            color: black;
        }

        /* Right Section */
        .right-section {
            margin-left: 270px;
            padding: 20px;
            width: calc(100% -270px);
        }

        .exercise-category {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .exercise-category h2 {
            text-align: center;
            color: #ff80ff;
            margin-bottom: 20px;
        }

        .exercise-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .exercise {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            width: 45%;
            position: relative;
        }

        .exercise h3 {
            margin-bottom: 10px;
            color: #00e5ff;
        }

        .exercise video {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        .exercise p {
            margin-top: 10px;
            font-size: 18px;
            color: #ff80ff;
        }
    </style>
</head>
<body>

 <!--Sidebar--> 
<div class="sidebar">
    <div class="sidebar-title">GYM EXERCISES</div>
    <a href="#chest" class="exercise-group">Chest</a>
    <a href="#biceps" class="exercise-group">Biceps</a>
    <a href="#back" class="exercise-group">Back</a>
    <a href="#triceps" class="exercise-group">Triceps</a>
    <a href="#legs" class="exercise-group">Legs</a>
    <a href="#shoulders" class="exercise-group">Shoulders</a>
</div>

<!-- Right Section--> 
<div class="right-section">

    <!-- ✅ Chest Section -->
    <div id="chest" class="exercise-category">
        <h2>Chest Exercises</h2>
        <div class="exercise-container">
            <div class="exercise">
                <h3>Push Ups</h3>
                
                <video controls>
                    <source src="./stock/pushups.mov" type="video/mp4">
                </video>
            </div>
            
            <div class="exercise">
                <h3>Bench Press</h3>
                
                <video controls>
                    <source src="./stock/Benchpress2.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

    <!-- ✅ Biceps Section -->
    <div id="biceps" class="exercise-category">
        <h2>Biceps Exercises</h2>
        <div class="exercise-container">
            <div class="exercise">
                <h3>Barbell Curl</h3>
                
                <video controls>
                    <source src="./stock/Barbell curl.mov" type="video/mp4">
                </video>
            </div>

            <div class="exercise">
                <h3>Hammer Curl</h3>
                
                <video controls>
                    <source src="./stock/hammer curl2.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

    <!-- ✅ Back Section -->
    <div id="back" class="exercise-category">
        <h2>Back Exercises</h2>
        <div class="exercise-container">
            <div class="exercise">
                <h3>Deadlift</h3>
                
                <video controls>
                    <source src="./stock/dead lift.mp4" type="video/mp4">
                </video>
            </div>

            <div class="exercise">
                <h3>Pull Ups</h3>
                
                <video controls>
                    <source src="./stock/pull ups.mov" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

    <!-- ✅ Triceps Section -->
    <div id="triceps" class="exercise-category">
        <h2>Triceps Exercises</h2>
        <div class="exercise-container">
            <div class="exercise">
                <h3>Tricep Dips</h3>
                
                <video controls>
                    <source src="./stock/tricpes dips.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

    <!-- ✅ Legs Section -->
    <div id="legs" class="exercise-category">
        <h2>Legs Exercises</h2>
        <div class="exercise-container">
            <div class="exercise">
                <h3>Leg press</h3>
                
                <video controls>
                    <source src="./stock/leg press.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

    <!-- ✅ Shoulders Section -->
    <div id="shoulders" class="exercise-category">
        <h2>Shoulder Exercises</h2>
        <div class="exercise-container">
            <div class="exercise">
                <h3>Shoulder Press</h3>
                
                <video controls>
                    <source src="./stock/shoulder press.mov" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

</div>

</body>
</html>
